<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd0aa" />
      <stop offset="100%" stop-color="#f6be92" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background circle with gradient -->
  <circle cx="120" cy="120" r="110" fill="url(#grad-bg)" />
  
  <!-- Outer accent ring -->
  <circle cx="120" cy="120" r="115" fill="none" stroke="#6366f1" stroke-width="3" stroke-dasharray="8 6" opacity="0.6" />

  <!-- Developer Silhouette / Illustration -->
  <!-- Clothes / Body -->
  <path d="M50 220 C50 175, 80 160, 120 160 C160 160, 190 175, 190 220 Z" fill="#1e293b" />
  <!-- Inner shirt collar -->
  <polygon points="120,175 105,160 135,160" fill="#ffffff" />
  <polygon points="120,188 112,165 128,165" fill="#4f46e5" />

  <!-- Neck -->
  <rect x="108" y="132" width="24" height="28" rx="4" fill="url(#skin)" />

  <!-- Head -->
  <ellipse cx="120" cy="105" rx="36" ry="42" fill="url(#skin)" filter="url(#shadow)" />

  <!-- Hair -->
  <path d="M84 95 C82 65, 110 50, 140 55 C156 58, 162 70, 156 90 C150 75, 138 72, 120 72 C100 72, 90 82, 84 95 Z" fill="#0f172a" />
  
  <!-- Modern Glasses -->
  <rect x="94" y="96" width="22" height="15" rx="3" fill="none" stroke="#0f172a" stroke-width="3.2" />
  <rect x="124" y="96" width="22" height="15" rx="3" fill="none" stroke="#0f172a" stroke-width="3.2" />
  <line x1="116" y1="103" x2="124" y2="103" stroke="#0f172a" stroke-width="3.2" />
  <path d="M94 102 L86 99" stroke="#0f172a" stroke-width="2.5" />
  <path d="M146 102 L154 99" stroke="#0f172a" stroke-width="2.5" />

  <!-- Eyes behind glasses -->
  <circle cx="105" cy="103" r="2.5" fill="#0f172a" />
  <circle cx="135" cy="103" r="2.5" fill="#0f172a" />

  <!-- Nose & Smile -->
  <path d="M120 110 L118 118 L122 118" fill="none" stroke="#e09f6e" stroke-width="2" stroke-linecap="round" />
  <path d="M112 126 Q120 134 128 126" fill="none" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round" />

  <!-- Coding badge icon at bottom right -->
  <circle cx="185" cy="185" r="26" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
  <text x="185" y="191" font-family="monospace" font-size="15" font-weight="bold" fill="#38bdf8" text-anchor="middle">&lt;/&gt;</text>
</svg>
